version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: auto_maestro_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automaestro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureAutoPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-automaestro_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automaestro -d automaestro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auto_maestro_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: auto_maestro_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-automaestro}:${POSTGRES_PASSWORD:-SecureAutoPass2026!}@postgres:5432/${POSTGRES_DB:-automaestro_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-SuperSecretAutoMaestroJWTKey2026_SpainEnterprise}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-SuperSecretAutoMaestroRefreshKey2026}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: auto_maestro_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: auto_maestro_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
